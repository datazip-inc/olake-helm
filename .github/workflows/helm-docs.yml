name: Check Helm Docs

on:
  pull_request:
    paths:
      - 'helm/olake/values.yaml'
      - 'helm/olake/Chart.yaml'
      - 'helm/olake/OLAKE_README.md.gotmpl'

permissions:
  contents: read

jobs:
  check-helm-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run helm-docs
        run: ./scripts/helm-docs.sh

      - name: Check for documentation changes
        run: |
          git diff --exit-code helm/olake/OLAKE_README.md
