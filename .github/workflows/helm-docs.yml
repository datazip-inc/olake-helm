name: Auto Update Helm Docs

on:
  pull_request:
    paths:
      - 'helm/olake/values.yaml'
      - 'helm/olake/Chart.yaml'
      - 'helm/olake/OLAKE_README.md.gotmpl'
  push:
    branches:
      - master
      - staging
    paths:
      - 'helm/olake/values.yaml'
      - 'helm/olake/Chart.yaml'
      - 'helm/olake/OLAKE_README.md.gotmpl'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  helm-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.ref || github.ref }}
          fetch-depth: 0

      - name: Install official helm-docs
        run: |
          HELM_DOCS_VERSION="1.14.2"
          curl -sSL "https://github.com/norwoodj/helm-docs/releases/download/v${HELM_DOCS_VERSION}/helm-docs_${HELM_DOCS_VERSION}_Linux_x86_64.tar.gz" | tar -xz
          sudo mv helm-docs /usr/local/bin/
          helm-docs --version

      - name: Run helm-docs
        run: |
          helm-docs --chart-search-root=helm/olake --template-files=OLAKE_README.md.gotmpl --output-file=OLAKE_README.md

      - name: Auto-commit and push updated OLAKE_README.md
        run: |
          git config user.name "${{ github.actor }}"
          git config user.email "${{ github.actor }}@users.noreply.github.com"
          if [[ -n $(git status --porcelain helm/olake/OLAKE_README.md) ]]; then
            git add helm/olake/OLAKE_README.md
            git commit -m "docs(helm): auto-update OLAKE_README.md via helm-docs [skip ci]"
            git push
          else
            echo "No documentation changes detected. Working tree is clean."
          fi
