name: Auto Update Helm Docs

on:
  pull_request:
    paths:
      - 'helm/olake/values.yaml'
      - 'helm/olake/Chart.yaml'
      - 'helm/olake/OLAKE_README.md.gotmpl'
  push:
    branches:
      - master
      - staging
    paths:
      - 'helm/olake/values.yaml'
      - 'helm/olake/Chart.yaml'
      - 'helm/olake/OLAKE_README.md.gotmpl'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  helm-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || '' }}
          fetch-depth: 0

      - name: Run helm-docs
        uses: losisin/helm-docs-github-action@v2
        with:
          chart-search-root: "helm/olake"
          template-files: "OLAKE_README.md.gotmpl"
          output-file: "OLAKE_README.md"

      - name: Auto-commit and push updated OLAKE_README.md
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "docs(helm): auto-update OLAKE_README.md via helm-docs [skip ci]"
          file_pattern: "helm/olake/OLAKE_README.md"
          commit_user_name: "github-actions[bot]"
          commit_user_email: "github-actions[bot]@users.noreply.github.com"
          commit_author: "github-actions[bot] <github-actions[bot]@users.noreply.github.com>"
