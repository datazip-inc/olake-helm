suite: olake-ui custom CA
templates:
  - templates/olake-ui/deployment.yaml
  - templates/olake-ui/custom-ca-configmap.yaml
release:
  name: olake
  namespace: olake
tests:
  - it: adds nothing by default
    template: templates/olake-ui/deployment.yaml
    asserts:
      - notContains:
          path: spec.template.spec.volumes
          content:
            name: custom-ca
          any: true
      - notExists:
          path: spec.template.metadata.annotations["checksum/custom-ca"]

  - it: creates no ConfigMap by default
    template: templates/olake-ui/custom-ca-configmap.yaml
    asserts:
      - hasDocuments:
          count: 0

  - it: creates a ConfigMap from an inline certificate
    template: templates/olake-ui/custom-ca-configmap.yaml
    set:
      olakeUI.customCA.certificate: |
        -----BEGIN CERTIFICATE-----
        MIIB
        -----END CERTIFICATE-----
    asserts:
      - isKind:
          of: ConfigMap
      - equal:
          path: metadata.name
          value: olake-custom-ca
      - equal:
          path: metadata.namespace
          value: olake
      - matchRegex:
          path: data["ca.crt"]
          pattern: "BEGIN CERTIFICATE"

  - it: keeps a PEM bundle intact in the ConfigMap
    template: templates/olake-ui/custom-ca-configmap.yaml
    set:
      olakeUI.customCA.certificate: "-----BEGIN CERTIFICATE-----\r\nMIIA\r\n-----END CERTIFICATE-----\r\n-----BEGIN CERTIFICATE-----\r\nMIIB\r\n-----END CERTIFICATE-----\r\n\r\n"
    asserts:
      - equal:
          path: data["ca.crt"]
          value: "-----BEGIN CERTIFICATE-----\nMIIA\n-----END CERTIFICATE-----\n-----BEGIN CERTIFICATE-----\nMIIB\n-----END CERTIFICATE-----\n"

  - it: truncates the ConfigMap name without losing the suffix
    template: templates/olake-ui/custom-ca-configmap.yaml
    set:
      fullnameOverride: a-fullname-override-long-enough-to-hit-the-sixty-three-char-cap
      olakeUI.customCA.certificate: |
        -----BEGIN CERTIFICATE-----
        MIIB
        -----END CERTIFICATE-----
    asserts:
      - matchRegex:
          path: metadata.name
          pattern: "^.{1,53}-custom-ca$"

  - it: mounts the chart-created ConfigMap and rolls the pod on change
    template: templates/olake-ui/deployment.yaml
    set:
      olakeUI.customCA.certificate: |
        -----BEGIN CERTIFICATE-----
        MIIB
        -----END CERTIFICATE-----
    asserts:
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: custom-ca
            mountPath: /etc/ssl/certs/olake-custom-ca.crt
            subPath: ca.crt
            readOnly: true
      - contains:
          path: spec.template.spec.volumes
          content:
            name: custom-ca
            configMap:
              name: olake-custom-ca
              items:
                - key: ca.crt
                  path: ca.crt
      - equal:
          path: spec.template.metadata.annotations["checksum/custom-ca"]
          value: 8010bfcee1842b2a4ce8f67c3e9455f0188f7a15bf39ec61a26feb75cd785821

  - it: mounts an existing ConfigMap without creating one
    template: templates/olake-ui/deployment.yaml
    set:
      olakeUI.customCA.existingConfigMap: "0123"
      olakeUI.customCA.key: "true"
    asserts:
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: custom-ca
            mountPath: /etc/ssl/certs/olake-custom-ca.crt
            subPath: ca.crt
            readOnly: true
      - contains:
          path: spec.template.spec.volumes
          content:
            name: custom-ca
            configMap:
              name: "0123"
              items:
                - key: "true"
                  path: ca.crt
      - notExists:
          path: spec.template.metadata.annotations["checksum/custom-ca"]

  - it: defaults the existing ConfigMap key to ca.crt
    template: templates/olake-ui/deployment.yaml
    set:
      olakeUI.customCA.existingConfigMap: corp-ca
    asserts:
      - contains:
          path: spec.template.spec.volumes
          content:
            name: custom-ca
            configMap:
              name: corp-ca
              items:
                - key: ca.crt
                  path: ca.crt

  - it: rejects a key that is not a valid ConfigMap key
    template: templates/olake-ui/deployment.yaml
    set:
      olakeUI.customCA.existingConfigMap: corp-ca
      olakeUI.customCA.key: ../ca.crt
    asserts:
      - failedTemplate: {}

  - it: rejects unknown customCA fields
    template: templates/olake-ui/deployment.yaml
    set:
      olakeUI.customCA.existingConfigmap: corp-ca
    asserts:
      - failedTemplate: {}

  - it: renders nothing when customCA is null
    template: templates/olake-ui/deployment.yaml
    set:
      olakeUI.customCA: null
    asserts:
      - notContains:
          path: spec.template.spec.volumes
          content:
            name: custom-ca
          any: true

  - it: creates no ConfigMap when an existing one is used
    template: templates/olake-ui/custom-ca-configmap.yaml
    set:
      olakeUI.customCA.existingConfigMap: corp-ca
    asserts:
      - hasDocuments:
          count: 0

  - it: fails when both certificate and existingConfigMap are set
    template: templates/olake-ui/deployment.yaml
    set:
      olakeUI.customCA.certificate: |
        -----BEGIN CERTIFICATE-----
        MIIB
        -----END CERTIFICATE-----
      olakeUI.customCA.existingConfigMap: corp-ca
    asserts:
      - failedTemplate:
          errorPattern: "set only one of olakeUI.customCA.certificate and olakeUI.customCA.existingConfigMap"

  - it: fails when the certificate is not PEM, such as a file path
    template: templates/olake-ui/deployment.yaml
    set:
      olakeUI.customCA.certificate: ./ca.crt
    asserts:
      - failedTemplate:
          errorPattern: "olakeUI.customCA.certificate must be a PEM certificate.*--set-file"

  - it: fails when the certificate contains a private key
    template: templates/olake-ui/deployment.yaml
    set:
      olakeUI.customCA.certificate: |
        -----BEGIN CERTIFICATE-----
        MIIB
        -----END CERTIFICATE-----
        -----BEGIN PRIVATE KEY-----
        MIIE
        -----END PRIVATE KEY-----
    asserts:
      - failedTemplate:
          errorPattern: "olakeUI.customCA.certificate must not contain a private key"
