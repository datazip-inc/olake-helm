suite: olake-ui extra volumes
templates:
  - templates/olake-ui/deployment.yaml
release:
  name: olake
  namespace: olake
set:
  olakeUI:
    extraVolumes:
      - name: pg-ca
        secret:
          secretName: pg-ca
    extraVolumeMounts:
      - name: pg-ca
        mountPath: /etc/olake/pg-ca
        readOnly: true
tests:
  - it: renders extra volumes and mounts
    asserts:
      - contains:
          path: spec.template.spec.volumes
          content:
            name: pg-ca
            secret:
              secretName: pg-ca
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: pg-ca
            mountPath: /etc/olake/pg-ca
            readOnly: true

  - it: renders alongside customCA
    set:
      olakeUI.customCA.existingConfigMap: corp-ca
    asserts:
      - contains:
          path: spec.template.spec.volumes
          content:
            name: pg-ca
            secret:
              secretName: pg-ca
      - contains:
          path: spec.template.spec.volumes
          content:
            name: custom-ca
            configMap:
              name: corp-ca
              items:
                - key: ca.crt
                  path: ca.crt

  - it: allows extra mounts of built-in volumes
    set:
      olakeUI:
        extraVolumes: []
        extraVolumeMounts:
          - name: shared-storage
            mountPath: /mnt/extra
    asserts:
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: shared-storage
            mountPath: /mnt/extra

  - it: fails when a mount has no matching volume
    set:
      olakeUI:
        extraVolumes: []
    asserts:
      - failedTemplate:
          errorPattern: "olakeUI.extraVolumeMounts entry \"pg-ca\" matches no volume; available: olake-config, shared-storage$"

  - it: fails when a mount uses custom-ca without customCA set
    set:
      olakeUI:
        extraVolumes: []
        extraVolumeMounts:
          - name: custom-ca
            mountPath: /mnt/ca
    asserts:
      - failedTemplate:
          errorPattern: "olakeUI.extraVolumeMounts entry \"custom-ca\" matches no volume"

  - it: allows a custom-ca mount when customCA is set
    set:
      olakeUI:
        customCA:
          existingConfigMap: corp-ca
        extraVolumes: []
        extraVolumeMounts:
          - name: custom-ca
            mountPath: /mnt/ca
    asserts:
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: custom-ca
            mountPath: /mnt/ca

  - it: fails when a mount uses registry-creds without a pull secret
    set:
      olakeUI:
        extraVolumes: []
        extraVolumeMounts:
          - name: registry-creds
            mountPath: /mnt/registry
    asserts:
      - failedTemplate:
          errorPattern: "olakeUI.extraVolumeMounts entry \"registry-creds\" matches no volume"

  - it: allows a registry-creds mount when a pull secret is set
    set:
      global:
        imagePullSecrets:
          - name: reg
      olakeUI:
        extraVolumes: []
        extraVolumeMounts:
          - name: registry-creds
            mountPath: /mnt/registry
    asserts:
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: registry-creds
            mountPath: /mnt/registry

  - it: appends extra volumes after the built-in ones
    asserts:
      - equal:
          path: spec.template.spec.volumes[-1].name
          value: pg-ca
      - equal:
          path: spec.template.spec.containers[0].volumeMounts[-1].name
          value: pg-ca

  - it: rejects extra volumes that reuse a built-in name
    set:
      olakeUI:
        extraVolumes:
          - name: custom-ca
            emptyDir: {}
    asserts:
      - failedTemplate:
          errorPattern: "extraVolumes/0/name"

  - it: rejects mounting at the root path
    set:
      olakeUI:
        extraVolumeMounts:
          - name: pg-ca
            mountPath: /
    asserts:
      - failedTemplate:
          errorPattern: "extraVolumeMounts/0/mountPath"
