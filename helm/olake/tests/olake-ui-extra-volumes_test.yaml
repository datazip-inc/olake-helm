suite: olake-ui extra volumes
templates:
  - templates/olake-ui/deployment.yaml
release:
  namespace: olake
set:
  olakeUI:
    extraVolumes:
      - name: custom-ca
        configMap:
          name: custom-ca
    extraVolumeMounts:
      - name: custom-ca
        mountPath: /etc/ssl/certs/custom-ca.crt
        subPath: custom-ca.crt
        readOnly: true
tests:
  - it: renders nothing extra by default
    set:
      olakeUI:
        extraVolumes: []
        extraVolumeMounts: []
    asserts:
      - notContains:
          path: spec.template.spec.volumes
          content:
            name: custom-ca
          any: true

  - it: mounts the volume when no cluster is reachable (helm template, GitOps)
    asserts:
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: custom-ca
            mountPath: /etc/ssl/certs/custom-ca.crt
            subPath: custom-ca.crt
            readOnly: true
      - contains:
          path: spec.template.spec.volumes
          content:
            name: custom-ca
            configMap:
              name: custom-ca

  - it: fails when a mount has no matching volume
    set:
      olakeUI:
        extraVolumes: []
    asserts:
      - failedTemplate:
          errorPattern: "olakeUI.extraVolumeMounts.*custom-ca.*no matching entry in olakeUI.extraVolumes"

  - it: fails when the referenced ConfigMap is missing from the cluster
    kubernetesProvider:
      scheme:
        "v1/ConfigMap":
          gvr:
            version: "v1"
            resource: "configmaps"
          namespaced: true
      objects:
        - apiVersion: v1
          kind: ConfigMap
          metadata:
            name: kube-root-ca.crt
            namespace: olake
    asserts:
      - failedTemplate:
          errorPattern: "ConfigMap \"custom-ca\".*not found in namespace \"olake\""

  - it: renders when the referenced ConfigMap exists
    kubernetesProvider:
      scheme:
        "v1/ConfigMap":
          gvr:
            version: "v1"
            resource: "configmaps"
          namespaced: true
      objects:
        - apiVersion: v1
          kind: ConfigMap
          metadata:
            name: kube-root-ca.crt
            namespace: olake
        - apiVersion: v1
          kind: ConfigMap
          metadata:
            name: custom-ca
            namespace: olake
    asserts:
      - contains:
          path: spec.template.spec.volumes
          content:
            name: custom-ca
            configMap:
              name: custom-ca

  - it: fails when the referenced Secret is missing from the cluster
    set:
      olakeUI:
        extraVolumes:
          - name: custom-ca
            secret:
              secretName: custom-ca
    kubernetesProvider:
      scheme:
        "v1/ConfigMap":
          gvr:
            version: "v1"
            resource: "configmaps"
          namespaced: true
        "v1/Secret":
          gvr:
            version: "v1"
            resource: "secrets"
          namespaced: true
      objects:
        - apiVersion: v1
          kind: ConfigMap
          metadata:
            name: kube-root-ca.crt
            namespace: olake
    asserts:
      - failedTemplate:
          errorPattern: "Secret \"custom-ca\".*not found in namespace \"olake\""

  - it: renders when the referenced Secret exists
    set:
      olakeUI:
        extraVolumes:
          - name: custom-ca
            secret:
              secretName: custom-ca
    kubernetesProvider:
      scheme:
        "v1/ConfigMap":
          gvr:
            version: "v1"
            resource: "configmaps"
          namespaced: true
        "v1/Secret":
          gvr:
            version: "v1"
            resource: "secrets"
          namespaced: true
      objects:
        - apiVersion: v1
          kind: ConfigMap
          metadata:
            name: kube-root-ca.crt
            namespace: olake
        - apiVersion: v1
          kind: Secret
          metadata:
            name: custom-ca
            namespace: olake
    asserts:
      - contains:
          path: spec.template.spec.volumes
          content:
            name: custom-ca
            secret:
              secretName: custom-ca

  - it: allows extra mounts of built-in volumes
    set:
      olakeUI:
        extraVolumes: []
        extraVolumeMounts:
          - name: shared-storage
            mountPath: /mnt/extra
    asserts:
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: shared-storage
            mountPath: /mnt/extra

  - it: skips the existence check for optional volumes
    set:
      olakeUI:
        extraVolumes:
          - name: custom-ca
            configMap:
              name: custom-ca
              optional: true
    kubernetesProvider:
      scheme:
        "v1/ConfigMap":
          gvr:
            version: "v1"
            resource: "configmaps"
          namespaced: true
      objects:
        - apiVersion: v1
          kind: ConfigMap
          metadata:
            name: kube-root-ca.crt
            namespace: olake
    asserts:
      - contains:
          path: spec.template.spec.volumes
          content:
            name: custom-ca
            configMap:
              name: custom-ca
              optional: true
