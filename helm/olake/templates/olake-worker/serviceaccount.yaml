{{- /*
TODO: Remove the Helm hook logic in a future release (e.g. v1.0.0).
*/ -}}
{{- $s3IRSAAnnotations := include "olake.s3IRSAAnnotations" . | fromYaml | default dict }}
{{- $workerAnnotations := .Values.olakeWorker.serviceAccount.annotations | default dict }}
{{- $mergedAnnotations := mergeOverwrite $s3IRSAAnnotations $workerAnnotations }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "olake.workerServiceAccountName" . }}
  namespace: {{ include "olake.namespace" . }}
  annotations:
    {{- if not .Values.useStandardResources }}
    "helm.sh/hook": pre-install # pre-upgrade was removed to avoid race conditions during upgrade process
    "helm.sh/hook-weight": "50"
    "helm.sh/hook-delete-policy": before-hook-creation
    {{- end }}
    {{- with $mergedAnnotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  labels:
    {{- include "olake.labels" . | nindent 4 }}
    app.kubernetes.io/component: workers