apiVersion: v1
kind: ConfigMap
metadata:
  name: olake-workers-config
  namespace: {{ include "olake.namespace" . }}
  annotations: {}
  labels:
    {{- include "olake.labels" . | nindent 4 }}
    app.kubernetes.io/component: workers
data:
  # Temporal Configuration
  {{- if .Values.temporal.enabled }}
  TEMPORAL_ADDRESS: "temporal.{{ include "olake.namespace" . }}.svc.cluster.local:7233"
  {{- end }}
  
  # Kubernetes Configuration
  WORKER_NAMESPACE: {{ include "olake.namespace" . | quote }}
  OLAKE_STORAGE_PVC_NAME: {{ include "olake.sharedStoragePVC" . | quote }}

  # Logging Configuration
  LOG_LEVEL: {{ .Values.olakeWorker.config.logging.level | quote }}
  LOG_FORMAT: {{ .Values.olakeWorker.config.logging.format | quote }}
  
  # Runtime Configuration
  RUN_MODE: {{ .Values.olakeWorker.env.RUN_MODE | default .Values.global.env.RUN_MODE | default "staging" }}

  # API Callback
  OLAKE_CALLBACK_URL: "http://olake-ui.{{ include "olake.namespace" . }}.svc.cluster.local:8000/internal/worker/callback"
  # =================================================================
  # JOB MAPPING CONFIGURATION (Deprecated)
  # =================================================================
  {{- if .Values.global.jobMapping }}
  OLAKE_JOB_MAPPING: {{ .Values.global.jobMapping | toJson | quote }}
  {{- end }}

  # =================================================================
  # JOB PROFILES CONFIGURATION
  # =================================================================
  # A profile carries both scheduling (nodeSelector / tolerations / affinity)
  # and the per-job index volume (indexStorage). Profile 0 is the default that
  # every job inherits; a JobID profile is deep-merged over it, field by field,
  # by the worker. Profile 0 is always emitted so `global.storageClass` reaches
  # the index even when the user replaces jobProfiles wholesale.
  {{- $profiles := deepCopy (.Values.global.jobProfiles | default dict) }}
  {{- $profile0 := deepCopy (get $profiles "0" | default dict) }}
  {{- $index0 := deepCopy (get $profile0 "indexStorage" | default dict) }}
  {{- if not (get $index0 "storageClass") }}
  {{- $_ := set $index0 "storageClass" (.Values.global.storageClass | default "") }}
  {{- end }}
  {{- $_ := set $profile0 "indexStorage" $index0 }}
  {{- $_ := set $profiles "0" $profile0 }}
  # Converted to JSON for consistent parsing by the worker
  OLAKE_JOB_PROFILES: {{ $profiles | toJson | quote }}

  # =================================================================
  # JOB SERVICE ACCOUNT CONFIGURATION
  # =================================================================
  JOB_SERVICE_ACCOUNT_NAME: {{ include "olake.jobServiceAccountName" . | quote }}


  # =================================================================
  # POD SECURITY CONTEXT CONFIGURATION
  # =================================================================
  {{- if .Values.olakeWorker.securityContext }}
  POD_SECURITY_CONTEXT: {{ .Values.olakeWorker.securityContext | toJson | quote }}
  {{- end }}

  # =================================================================
  # ACTIVITY POD ANNOTATIONS CONFIGURATION
  # =================================================================
  {{- if .Values.global.podAnnotations }}
  OLAKE_JOB_POD_ANNOTATIONS: {{ .Values.global.podAnnotations | toJson | quote }}
  {{- end }}