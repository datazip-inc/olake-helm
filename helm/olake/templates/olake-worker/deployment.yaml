apiVersion: apps/v1
kind: Deployment
metadata:
  name: olake-workers
  namespace: {{ include "olake.namespace" . }}
  annotations: {}
  labels:
    {{- include "olake.labels" . | nindent 4 }}
    app.kubernetes.io/component: workers
spec:
  replicas: 1
  minReadySeconds: 30
  selector:
    matchLabels:
      app.kubernetes.io/name: olake-workers
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: workers
  template:
    metadata:
      annotations:
        {{- with .Values.global.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- with .Values.olakeWorker.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        app.kubernetes.io/name: olake-workers
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: workers
        {{- with .Values.olakeWorker.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.olakeWorker.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.olakeWorker.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.olakeWorker.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.olakeWorker.securityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "olake.workerServiceAccountName" . }}
      {{- if .Values.temporal.enabled }}
      initContainers:
      - name: wait-for-temporal
        image: "{{ include "olake.registryBase" . }}/library/busybox:latest"
        imagePullPolicy: IfNotPresent
        command:
        - /bin/sh
        - -c
        - |
          echo "Waiting for Temporal to be ready..."
          until nc -z temporal.{{ include "olake.namespace" . }}.svc.cluster.local 7233; do
            echo "Temporal is not ready yet. Waiting..."
            sleep 5
          done
          echo "Temporal is ready!"
      {{- end }}
      containers:
      - name: olake-workers
        image: "{{ include "olake.registryBase" . }}/{{ .Values.olakeWorker.image.repository }}:{{ .Values.olakeWorker.image.tag }}"
        imagePullPolicy: {{ .Values.olakeWorker.image.pullPolicy }}
        ports:
        - name: health
          containerPort: 8090
          protocol: TCP
        env:
        - name: POD_NAME
          valueFrom:
            fieldRef:
              apiVersion: v1
              fieldPath: metadata.name
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              apiVersion: v1
              fieldPath: metadata.namespace
        # Database configuration
        - name: DB_HOST
          valueFrom:
            secretKeyRef:
              name: {{ include "olake.postgresql.secretName" . }}
              key: {{ if .Values.postgresql.enabled }}host{{ else }}{{ .Values.postgresql.external.secretKeys.host }}{{ end }}
        - name: DB_PORT
          valueFrom:
            secretKeyRef:
              name: {{ include "olake.postgresql.secretName" . }}
              key: {{ if .Values.postgresql.enabled }}port{{ else }}{{ .Values.postgresql.external.secretKeys.port }}{{ end }}
        - name: DB_NAME
          {{- if .Values.postgresql.enabled }}
          value: "postgres"
          {{- else }}
          valueFrom:
            secretKeyRef:
              name: {{ include "olake.postgresql.secretName" . }}
              key: {{ .Values.postgresql.external.secretKeys.olake_database }}
          {{- end }}
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: {{ include "olake.postgresql.secretName" . }}
              key: {{ if .Values.postgresql.enabled }}username{{ else }}{{ .Values.postgresql.external.secretKeys.username }}{{ end }}
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ include "olake.postgresql.secretName" . }}
              key: {{ if .Values.postgresql.enabled }}password{{ else }}{{ .Values.postgresql.external.secretKeys.password }}{{ end }}
        - name: DB_SSLMODE
          valueFrom:
            secretKeyRef:
              name: {{ include "olake.postgresql.secretName" . }}
              key: {{ if .Values.postgresql.enabled }}ssl_mode{{ else }}{{ .Values.postgresql.external.secretKeys.ssl_mode }}{{ end }}
        {{- range $key, $value := .Values.global.env }}
        - name: {{ $key }}
          value: {{ $value | quote }}
        {{- end }}
        {{- range $key, $value := .Values.olakeWorker.env }}
        - name: {{ $key }}
          value: {{ $value | quote }}
        {{- end }}
        # Log storage configuration
        - name: OLAKE_STORAGE_MODE
          value: {{ include "olake.storageMode" . | quote }}
        {{- if eq (include "olake.storageMode" .) "s3" }}
        - name: OLAKE_S3_BUCKET
          value: {{ required "s3LogFileStorage.bucket is required when S3 log storage is active" .Values.s3LogFileStorage.bucket | quote }}
        - name: OLAKE_S3_REGION
          value: {{ required "s3LogFileStorage.region is required when S3 log storage is active" .Values.s3LogFileStorage.region | quote }}
        {{- if .Values.s3LogFileStorage.prefix }}
        - name: OLAKE_S3_PREFIX
          value: {{ .Values.s3LogFileStorage.prefix | quote }}
        {{- end }}
        {{- if eq (include "olake.s3LogFileStorageLocal" .) "true" }}
        - name: OLAKE_S3_ENDPOINT
          value: {{ required "s3LogFileStorage.endpoint is required for local MinIO" .Values.s3LogFileStorage.endpoint | quote }}
        {{- end }}
        {{- if and (not .Values.s3LogFileStorage.role.enabled) .Values.s3LogFileStorage.existingSecret }}
        - name: OLAKE_S3_CREDENTIALS_SECRET
          value: {{ .Values.s3LogFileStorage.existingSecret | quote }}
        - name: OLAKE_S3_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              name: {{ .Values.s3LogFileStorage.existingSecret }}
              key: OLAKE_S3_ACCESS_KEY_ID
        - name: OLAKE_S3_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: {{ .Values.s3LogFileStorage.existingSecret }}
              key: OLAKE_S3_SECRET_ACCESS_KEY
        {{- end }}
        {{- end }}
        envFrom:
        - configMapRef:
            name: olake-workers-config
        {{- if not .Values.temporal.enabled }}
        - secretRef:
            name: {{ include "olake.temporal.secretName" . }}
        {{- end }}
        {{- $defaultResources := dict 
          "requests" (dict "memory" "256Mi" "cpu" "250m")
        }}
        {{- $resources := mergeOverwrite $defaultResources (.Values.olakeWorker.resources | default dict) }}
        resources:
          {{- toYaml $resources | nindent 10 }}
        {{- $defaultReadinessProbe := dict
          "initialDelaySeconds" 5
          "periodSeconds" 10
          "timeoutSeconds" 5
          "failureThreshold" 3
          "successThreshold" 1
          "exec" (dict "command" (list "/bin/sh" "-c" (include "olake.workerReadinessProbeShell" .)))
        }}
        {{- $readinessProbe := mergeOverwrite $defaultReadinessProbe (.Values.olakeWorker.readinessProbe | default dict) }}
        readinessProbe:
          {{- toYaml $readinessProbe | nindent 10 }}
        {{- $defaultLivenessProbe := dict
          "initialDelaySeconds" 10
          "periodSeconds" 30
          "timeoutSeconds" 10
          "failureThreshold" 3
          "successThreshold" 1
          "exec" (dict "command" (list "/bin/sh" "-c" (include "olake.workerLivenessProbeShell" .)))
        }}
        {{- $livenessProbe := mergeOverwrite $defaultLivenessProbe (.Values.olakeWorker.livenessProbe | default dict) }}
        livenessProbe:
          {{- toYaml $livenessProbe | nindent 10 }}
        volumeMounts:
        - name: shared-storage
          mountPath: /data/olake-jobs
      volumes:
      - name: shared-storage
        {{- if eq (include "olake.storageMode" .) "nfs" }}
        persistentVolumeClaim:
          claimName: {{ include "olake.sharedStoragePVC" . }}
        {{- else }}
        emptyDir: {}
        {{- end }}