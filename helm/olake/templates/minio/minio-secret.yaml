{{- if and .Values.s3LogFileStorage.enabled (eq (include "olake.storageMode" .) "s3") }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "olake.minio.secretName" . }}
  namespace: {{ include "olake.namespace" . }}
  annotations:
    "helm.sh/resource-policy": keep
  labels:
    app.kubernetes.io/name: {{ include "olake.name" . }}-minio
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: minio
    {{- include "olake.labels" . | nindent 4 }}
type: Opaque
stringData:
  OLAKE_S3_ACCESS_KEY_ID: {{ .Values.s3LogFileStorage.auth.rootUser | quote }}
  OLAKE_S3_SECRET_ACCESS_KEY: {{ .Values.s3LogFileStorage.auth.rootPassword | quote }}
{{- end }}
