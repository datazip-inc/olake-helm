{{- if and .Values.s3LogFileStorage.enabled (eq (include "olake.storageMode" .) "s3") }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "olake.minio.serviceName" . }}
  namespace: {{ include "olake.namespace" . }}
  annotations:
    "helm.sh/resource-policy": keep
  labels:
    app.kubernetes.io/name: {{ include "olake.name" . }}-minio
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: minio
    {{- include "olake.labels" . | nindent 4 }}
spec:
  serviceName: {{ include "olake.minio.serviceName" . }}
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "olake.name" . }}-minio
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: minio
  template:
    metadata:
      annotations:
        {{- with .Values.s3LogFileStorage.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        app.kubernetes.io/name: {{ include "olake.name" . }}-minio
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: minio
        {{- with .Values.s3LogFileStorage.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.s3LogFileStorage.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.s3LogFileStorage.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.s3LogFileStorage.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
      - name: minio
        image: {{ include "olake.registryBase" . }}/{{ .Values.s3LogFileStorage.image.repository }}:{{ .Values.s3LogFileStorage.image.tag }}
        imagePullPolicy: IfNotPresent
        ports:
        - name: api
          containerPort: 9000
        - name: console
          containerPort: 9001
        args:
          - server
          - /data
          - "--console-address=:9001"
        env:
        - name: MINIO_ROOT_USER
          valueFrom:
            secretKeyRef:
              name: {{ include "olake.minio.secretName" . }}
              key: OLAKE_S3_ACCESS_KEY_ID
        - name: MINIO_ROOT_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ include "olake.minio.secretName" . }}
              key: OLAKE_S3_SECRET_ACCESS_KEY
        volumeMounts:
        - name: minio-data
          mountPath: /data
        readinessProbe:
          httpGet:
            path: /minio/health/ready
            port: api
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
          successThreshold: 1
        livenessProbe:
          httpGet:
            path: /minio/health/live
            port: api
          initialDelaySeconds: 30
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 3
          successThreshold: 1
        {{- $defaultResources := dict
          "requests" (dict "cpu" "250m" "memory" "256Mi")
          "limits" (dict "cpu" "500m" "memory" "512Mi")
        }}
        {{- $resources := mergeOverwrite $defaultResources (.Values.s3LogFileStorage.resources | default dict) }}
        resources:
          {{- toYaml $resources | nindent 10 }}
  volumeClaimTemplates:
  - metadata:
      name: minio-data
      annotations:
        "helm.sh/resource-policy": keep
    spec:
      accessModes:
        - ReadWriteOnce
      resources:
        requests:
          storage: {{ .Values.s3LogFileStorage.persistence.size | default "20Gi" }}
      {{- if .Values.global.storageClass }}
      storageClassName: {{ .Values.global.storageClass }}
      {{- end }}
{{- end }}
