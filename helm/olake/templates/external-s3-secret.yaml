{{- if and (eq (include "olake.storageMode" .) "s3") (not .Values.s3.auth.useIRSA) (not .Values.s3.auth.existingSecret) (or .Values.s3.auth.credentials.accessKeyId .Values.s3.auth.credentials.secretAccessKey) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "olake.s3.secretName" . }}
  namespace: {{ include "olake.namespace" . }}
  labels:
    {{- include "olake.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.s3.auth.secretKeys.accessKeyId | default "AWS_ACCESS_KEY_ID" }}: {{ required "s3.auth.credentials.accessKeyId is required when not using existingSecret or IRSA" .Values.s3.auth.credentials.accessKeyId | quote }}
  {{ .Values.s3.auth.secretKeys.secretAccessKey | default "AWS_SECRET_ACCESS_KEY" }}: {{ required "s3.auth.credentials.secretAccessKey is required when not using existingSecret or IRSA" .Values.s3.auth.credentials.secretAccessKey | quote }}
{{- end }}
