# Source/Destination may be defined as a Secret instead of a ConfigMap when
# the config contains credentials that shouldn't be plaintext in git. The
# shape (labels + data keys) is identical to the ConfigMap form — there is no
# separate reference field, this Secret *is* the managed resource.
apiVersion: v1
kind: Secret
metadata:
  name: smoke-source-secret
  labels:
    olake.io/managed: "true"
    olake.io/kind: source
type: Opaque
stringData:
  projectId: "123"
  userId: "1"
  config: |
    {
      "name": "smoke-source-secret",
      "type": "postgres",
      "version": "latest",
      "config": "{\"host\":\"pg.example\",\"port\":5432,\"database\":\"smoke\",\"username\":\"smoke\",\"password\":\"smoke\"}"
    }
