{{- /* Only created when Fusion points at an external PostgreSQL and the user did
       not supply their own secret. */}}
{{- if and (not .Values.postgresql.enabled) (not .Values.postgresql.external.existingSecret) }}
{{- $pg := .Values.postgresql.external.properties }}
{{- $keys := .Values.postgresql.external.secretKeys }}
{{- if not $pg.host }}
{{- fail "postgresql.external.properties.host is required when postgresql.enabled is false and no external.existingSecret is set" }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "fusion.postgresql.secretName" . }}
  namespace: {{ include "fusion.namespace" . }}
  labels:
    {{- include "fusion.labels" . | nindent 4 }}
    app.kubernetes.io/component: fusion
type: Opaque
stringData:
  {{ $keys.host }}: {{ $pg.host | quote }}
  {{ $keys.port }}: {{ $pg.port | quote }}
  {{ $keys.username }}: {{ $pg.username | quote }}
  {{ $keys.password }}: {{ $pg.password | quote }}
  {{ $keys.fusion_database }}: {{ $pg.fusion_database | quote }}
  {{ $keys.ssl_mode }}: {{ $pg.ssl_mode | quote }}
{{- end }}
